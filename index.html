<!DOCTYPE= html>
<html lang="en">   
    <head>
        <meta charset="UTF=8">
        <title> My Snowglobe</title>
        <link rel="stylesheet" href="style.css"/>
    </head>

    <body>
        <div class="background-snow" aria-hidden="true"></div>
        <header class="hero">
        <h1>My Snowglobe</h1>
        <p class="tagline">Shake it for a little winder kindess!</p>
        </header>

        <main>
            <section class="globe-card">
                <div class="globe" id="globe">
                <img class="scene" src="snowglobe.png" alt="snowglobe"/>
                <div class="globe-snow" aria-hidden="true"></div>
                </div>

                <button id="shake"> Shake the globe </button>
                <p class="message" id="message"> press the button and see what settles </p>
            </section>
        </main>

        <footer>
            <p> made by me, in the snow</p>
        </footer>
        <script src="script.js"></script>
    </body>

</html>
